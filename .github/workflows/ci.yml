name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: PHPStan and PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --no-progress
      # macOS and Windows checkouts keep only one of two paths that differ only by case.
      - name: No paths that differ only by case
        run: |
          collisions=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$collisions" ]; then echo "$collisions"; exit 1; fi

  tests:
    name: PHP ${{ matrix.php }}, Composer ${{ matrix.composer }}, ${{ matrix.os }}${{ matrix.reflink && ', Btrfs' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        composer: ['2.2', '2']
        exclude:
          # Composer 2.2, the LTS line for old PHP versions, crashes on PHP 8.5 in its own
          # RemoteFilesystem, which the tests' local file:// repository goes through.
          - { php: '8.5', composer: '2.2' }
        include:
          # Adds a Btrfs mount to this job, for the reflink tests (macOS runners have APFS anyway).
          - { os: ubuntu-latest, php: '8.4', composer: '2', reflink: true }
          - { os: macos-latest, php: '8.1', composer: '2.2' }
          - { os: macos-latest, php: '8.5', composer: '2' }
          - { os: windows-latest, php: '8.1', composer: '2.2' }
          - { os: windows-latest, php: '8.5', composer: '2' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v${{ matrix.composer }}
      - run: composer update --no-interaction --no-progress
      - run: composer --version
      # The runner's ext4 has no reflinks: ReflinkTest clones for real in a loop-mounted Btrfs.
      - name: Mount a Btrfs filesystem for the reflink tests
        if: matrix.reflink
        run: |
          sudo apt-get install -y -q btrfs-progs
          truncate -s 1G "$RUNNER_TEMP/reflink.img"
          mkfs.btrfs -q "$RUNNER_TEMP/reflink.img"
          sudo mkdir -p /mnt/reflink
          sudo mount -o loop "$RUNNER_TEMP/reflink.img" /mnt/reflink
          sudo chown "$(id -u):$(id -g)" /mnt/reflink
          echo "COMPOSER_STORE_TEST_REFLINK_DIR=/mnt/reflink" >> "$GITHUB_ENV"
      # The integration tests run the Composer that setup-php put on the PATH.
      - run: vendor/bin/phpunit

  laravel:
    name: Network tests (Laravel app, composer-patches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit --group network
