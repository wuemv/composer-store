name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: PHPStan and PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --no-progress

  tests:
    name: PHP ${{ matrix.php }}, Composer ${{ matrix.composer }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        composer: ['2.2', '2']
        exclude:
          # Composer 2.2, the LTS line for old PHP versions, crashes on PHP 8.5 in its own
          # RemoteFilesystem, which the tests' local file:// repository goes through.
          - { php: '8.5', composer: '2.2' }
        include:
          - { os: macos-latest, php: '8.1', composer: '2.2' }
          - { os: macos-latest, php: '8.5', composer: '2' }
          - { os: windows-latest, php: '8.1', composer: '2.2' }
          - { os: windows-latest, php: '8.5', composer: '2' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v${{ matrix.composer }}
      - run: composer update --no-interaction --no-progress
      - run: composer --version
      # The integration tests run the Composer that setup-php put on the PATH.
      - run: vendor/bin/phpunit

  laravel:
    name: Fresh Laravel app (network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit --group network
